# Supabase ในเครื่อง (npx supabase start) — ค่าที่ร้านนี้ใช้ ตัดส่วนที่ยังไม่ต้องใช้ออก
# เอกสาร: https://supabase.com/docs/guides/local-development/cli/config
project_id = "story-cafe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_settings.sql"]

# Studio ต้องเปิดไว้: MCP ของ Supabase ในเครื่องให้บริการผ่าน Studio (http://127.0.0.1:54321/mcp)
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ปิดไว้ก่อน (บทหลัง ๆ ค่อยเปิดเมื่อใช้): realtime, storage, analytics, edge_runtime, local_smtp
[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

# สิทธิ์เรียก Edge Function ตอน deploy (security review): webhook จากข้างนอกไม่มี JWT ของ Supabase จึงปิด verify_jwt
# และต้องตรวจลายเซ็นในโค้ดเอง (payment_webhook = Stripe-Signature, line_webhook = x-line-signature) · ที่เหลือต้องมี JWT
[functions.payment_webhook]
verify_jwt = false
[functions.line_webhook]
verify_jwt = false
[functions.create_payment]
verify_jwt = true
[functions.notify_owner]
verify_jwt = true
[functions.morning_summary]
verify_jwt = true

[analytics]
enabled = false

[local_smtp]
enabled = false
