[package]
name = "story-cafe-pos"
version = "0.1.0"
description = "POS หน้าร้านของ Story Cafe (Tauri)"
authors = ["Story Cafe"]
license = "Elastic-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "story_cafe_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
