<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>{{season}} · โปสเตอร์เมนู</title>
<style>
  @font-face { font-family: 'Kanit'; font-weight: 400; src: url('{{root}}/web/public/fonts/Kanit-Regular.ttf'); }
  @font-face { font-family: 'Kanit'; font-weight: 600; src: url('{{root}}/web/public/fonts/Kanit-SemiBold.ttf'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #f6efe4; color: #2f3a22; font-family: 'Kanit', sans-serif; padding: 90px 80px 70px; display: flex; flex-direction: column; }
  .season { font-size: 34px; letter-spacing: 0; color: #7d8a52; font-weight: 600; line-height: 1.6; }
  h1 { font-size: 104px; font-weight: 600; line-height: 1.35; margin: 18px 0 10px; color: #3d4a26; word-break: keep-all; text-wrap: balance; }
  .subline { font-size: 40px; line-height: 1.6; color: #5a5a46; margin-bottom: 56px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 34px; flex: 1; }
  li { background: #fffaf1; border: 3px solid #d9cdb4; border-radius: 28px; padding: 30px 40px; display: grid; grid-template-columns: 1fr auto; column-gap: 24px; align-items: baseline; }
  .name { font-size: 56px; font-weight: 600; line-height: 1.5; color: #3d4a26; }
  .price { font-size: 56px; font-weight: 600; line-height: 1.5; color: #b0602a; }
  .blurb { grid-column: 1 / span 2; font-size: 34px; line-height: 1.6; color: #6a6a56; }
  footer { margin-top: 40px; font-size: 32px; line-height: 1.6; color: #7d8a52; text-align: center; }
</style>
</head>
<body>
  <div class="season" id="season">{{season}}</div>
  <h1 id="headline">{{headline}}</h1>
  <p class="subline" id="subline">{{subline}}</p>
  <ul id="items">
{{items}}
  </ul>
  <footer id="footer">{{footer}}</footer>
</body>
</html>
